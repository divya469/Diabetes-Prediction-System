<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group select {
            cursor: pointer;
        }

        .hint {
            display: block;
            color: #999;
            font-size: 0.8em;
            margin-top: 5px;
        }

        .btn-predict {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-predict:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            animation: slideIn 0.5s ease;
        }

        .result.positive {
            background: #fee;
            border: 2px solid #f88;
        }

        .result.negative {
            background: #efe;
            border: 2px solid #8f8;
        }

        .result-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .result h2 {
            margin-bottom: 10px;
            font-size: 1.5em;
        }

        .result.positive h2 {
            color: #c33;
        }

        .result.negative h2 {
            color: #3c3;
        }

        .result p {
            color: #666;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            margin-top: 30px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        .hidden {
            display: none !important;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🩺 Diabetes Prediction</h1>
            <p>Enter your health information below to get a diabetes risk estimate.</p>
        </div>

        <form id="predictionForm">
            <div class="form-group" id="pregnanciesGroup">
                <label for="pregnancies">Pregnancies</label>
                <input type="number" id="pregnancies" name="Pregnancies" min="0" max="20" value="2" required>
                <span class="hint">Number of times pregnant</span>
            </div>

            <div class="form-group">
                <label for="glucose">Glucose (mg/dL)</label>
                <input type="number" id="glucose" name="Glucose" min="0" max="300" step="0.1" value="130" required>
                <span class="hint">Plasma glucose concentration</span>
            </div>

            <div class="form-group">
                <label for="bloodPressure">Blood Pressure (mm Hg)</label>
                <input type="number" id="bloodPressure" name="BloodPressure" min="0" max="200" step="0.1" value="70" required>
                <span class="hint">Diastolic blood pressure</span>
            </div>

            <div class="form-group">
                <label for="bmi">BMI (kg/m²)</label>
                <input type="number" id="bmi" name="BMI" min="0" max="70" step="0.1" value="28.5" required>
                <span class="hint">Body mass index</span>
            </div>

            <div class="form-group">
                <label for="age">Age (years)</label>
                <input type="number" id="age" name="Age" min="1" max="120" value="45" required>
                <span class="hint">Age in years</span>
            </div>

            <button type="submit" class="btn-predict">Predict</button>
        </form>

        <div id="result" class="result hidden">
            <div class="result-content">
                <div class="result-icon" id="resultIcon"></div>
                <h2 id="resultTitle"></h2>
                <p id="resultMessage"></p>
            </div>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Analyzing...</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('predictionForm');
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');
        const resultIcon = document.getElementById('resultIcon');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            console.log('Form submitted!');
            
            // Get form data
            const formData = {
                Pregnancies: parseInt(document.getElementById('pregnancies').value),
                Glucose: parseFloat(document.getElementById('glucose').value),
                BloodPressure: parseFloat(document.getElementById('bloodPressure').value),
                BMI: parseFloat(document.getElementById('bmi').value),
                Age: parseInt(document.getElementById('age').value)
            };
            
            console.log('Form data:', formData);
            
            // Show loading
            resultDiv.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            
            try {
                console.log('Making API call...');
                const response = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const data = await response.json();
                console.log('Response data:', data);
                
                // Hide loading
                loadingDiv.classList.add('hidden');
                
                // Show result
                resultDiv.classList.remove('hidden');
                
                if (data.diabetic) {
                    resultDiv.classList.remove('negative');
                    resultDiv.classList.add('positive');
                    resultIcon.textContent = '⚠️';
                    resultTitle.textContent = 'High Risk Detected';
                    resultMessage.textContent = 'Based on the provided health metrics, the model predicts a higher risk of diabetes. Please consult with a healthcare professional for proper diagnosis and guidance.';
                } else {
                    resultDiv.classList.remove('positive');
                    resultDiv.classList.add('negative');
                    resultIcon.textContent = '✅';
                    resultTitle.textContent = 'Low Risk';
                    resultMessage.textContent = 'Based on the provided health metrics, the model predicts a lower risk of diabetes. Continue maintaining a healthy lifestyle and regular check-ups.';
                }
                
                console.log('Result displayed!');
                
            } catch (error) {
                console.error('Error:', error);
                loadingDiv.classList.add('hidden');
                resultDiv.classList.remove('hidden', 'positive', 'negative');
                resultDiv.style.background = '#fff3cd';
                resultDiv.style.border = '2px solid #ffc107';
                resultIcon.textContent = '❌';
                resultTitle.textContent = 'Error';
                resultTitle.style.color = '#856404';
                resultMessage.textContent = 'Failed to connect to the prediction service. Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
